name: Import complete Amana site

on:
  push:
    branches:
      - agent/apply-theme-and-publish-site
    paths:
      - .github/workflows/import-site-assets.yml

permissions:
  contents: write

jobs:
  import-site:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Restore complete source tree
        shell: bash
        run: |
          set -Eeuo pipefail
          printf '%s  %s\n' '29f59bada5bbd51d3d408466ff63ddb1c884120ec2e4e80e37e41f3ab49f570d' '.bootstrap/source.tar.gz' |
            sha256sum --check --status
          tar -xzf .bootstrap/source.tar.gz

      - name: Download and verify public files
        shell: bash
        env:
          SITE_BASE_URL: https://amana-aug-2026.van-der-merwe.chatgpt.site
        run: |
          set -Eeuo pipefail
          cookie_jar="${RUNNER_TEMP}/amana-site.cookies"
          : > "$cookie_jar"

          while read -r expected path; do
            rel="${path#public/}"
            test "$rel" != "$path"
            mkdir -p "$(dirname "$path")"
            tmp="${path}.part"
            rm -f "$tmp"

            curl \
              --proto '=https' \
              --proto-redir '=https' \
              --tlsv1.2 \
              --fail \
              --location \
              --silent \
              --show-error \
              --retry 6 \
              --retry-all-errors \
              --retry-delay 2 \
              --connect-timeout 30 \
              --max-time 600 \
              --header 'Accept-Encoding: identity' \
              --user-agent 'trueChristian-site-import/1.0' \
              --cookie "$cookie_jar" \
              --cookie-jar "$cookie_jar" \
              "${SITE_BASE_URL}/${rel}" \
              --output "$tmp"

            printf '%s  %s\n' "$expected" "$tmp" |
              sha256sum --check --status
            mv "$tmp" "$path"
          done <<'ASSETS'
